[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrouter"
version = "0.1.0"
description = "A real tool-executing agent loop built on the OpenAI Responses API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.68.0",
    "trafilatura>=2.0.0",
    "typesafe-sdk",
    "uvicorn>=0.34.0",
]

[project.scripts]
agentrouter = "agentrouter.cli:main"

[tool.setuptools.packages.find]
include = ["agentrouter*"]

[tool.setuptools.package-data]
agentrouter = ["web/dist/*", "web/dist/assets/*"]
